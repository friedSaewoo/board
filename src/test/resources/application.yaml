spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:board_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

chess:
  stockfish:
    command: stockfish
    per-move-timeout-millis: 1000
    total-timeout-millis: 120000
    max-plies: 240
