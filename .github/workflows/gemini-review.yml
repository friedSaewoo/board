name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # 1. 변경된 코드(Diff) 추출
      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt
          
          if [ ! -s pr_diff.txt ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

# 워크플로우 파일 내부의 2단계 (cURL 호출 주소 부분)
      - name: Request Gemini Review
        if: steps.get_diff.outputs.has_changes == 'true'
        id: gemini_req
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT="당신은 유능한 시니어 개발자입니다. 아래 제공되는 Pull Request의 변경된 코드(Diff)를 분석하고, 가독성 개선점, 잠재적인 버그, 보안 취약점, 성능 최적화 방안을 찾아서 한국어로 친절하고 구체적인 리뷰 댓글을 작성해 주세요.\n\n[코드 변경 사항]\n$(cat pr_diff.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')"
          
          # 💡 모델명 자리에 'gemini-1.5-flash' 대신 'gemini-pro' 또는 'gemini-flash'를 넣으면 
          # 구글이 제공하는 가장 최신의 최첨단 엔진(3.5 포함 최신 버전)이 자동으로 호출됩니다!
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"contents\": [{\"parts\": [{\"text\": \"${PROMPT}\"}]}]}")
          
          echo "Gemini Raw Response: $RESPONSE"
          
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          
          if [ -z "$REVIEW_TEXT" ] || [ "$REVIEW_TEXT" = "null" ]; then
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // "모델 ID 공백 오류"')
            echo "제미니 API 오류 발생! 원인: $ERROR_MSG" > gemini_review.txt
          else
            echo "$REVIEW_TEXT" > gemini_review.txt
          fi

      # 3. 제미니가 작성한 리뷰를 PR 댓글로 달기
      - name: Comment PR
        if: steps.get_diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gemini_review.txt', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
