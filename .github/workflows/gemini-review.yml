name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # 1. 변경된 코드(Diff) 추출
      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt
          
          if [ ! -s pr_diff.txt ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # 2. 안전하게 JSON을 만들어서 최신 Gemini API 호출
      - name: Request Gemini Review
        if: steps.get_diff.outputs.has_changes == 'true'
        id: gemini_req
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 기본 지시사항 작성
          SYSTEM_PROMPT="당신은 유능한 시니어 개발자입니다. 아래 제공되는 Pull Request의 변경된 코드(Diff)를 분석하고, 가독성 개선점, 잠재적인 버그, 보안 취약점, 성능 최적화 방안을 찾아서 한국어로 친절하고 구체적인 리뷰 댓글을 작성해 주세요."
          CODE_DIFF=$(cat pr_diff.txt)
          
          # 전체 프롬프트 합치기
          FULL_PROMPT="$SYSTEM_PROMPT"$'\n\n'"[코드 변경 사항]"$'\n'"$CODE_DIFF"
          
          # 💡 [핵심] jq 도구를 사용해 어떤 특수문자나 줄바꿈이 있어도 완벽한 JSON 포맷으로 강제 인코딩합니다.
          jq -n --arg msg "$FULL_PROMPT" '{"contents": [{"parts": [{"text": $msg}]}]}' > gemini_request.json
          
          # API 호출 (최신 최강 모델인 gemini-pro 지정)
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @gemini_request.json)
          
          echo "Gemini Raw Response: $RESPONSE"
          
          # 결과 텍스트 추출
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          
          if [ -z "$REVIEW_TEXT" ] || [ "$REVIEW_TEXT" = "null" ]; then
            ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // "응답 파싱 실패"')
            echo "제미니 API 오류 발생! 원인: $ERROR_MSG" > gemini_review.txt
          else
            echo "$REVIEW_TEXT" > gemini_review.txt
          fi

      # 3. 리뷰를 PR 댓글로 달기
      - name: Comment PR
        if: steps.get_diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gemini_review.txt', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
