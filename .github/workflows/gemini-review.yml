name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # 현재 가장 안정적으로 작동하는 제미니 전용 코드 리뷰 액션
      - name: Gemini Code Reviewer
        uses: stefanprodan/gemini-code-review@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 구글 AI 스튜디오에서 최신 지원하는 안정화 모델명 지정
          gemini_model: "gemini-2.5-flash"
          language: "Korean"
          prompt: "당신은 유능한 시니어 개발자입니다. 코드의 잠재적 버그, 가독성, 성능 개선점을 한국어로 친절하게 리뷰해 주세요."