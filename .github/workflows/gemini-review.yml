name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # 1. 변경된 코드(Diff) 추출
      - name: Get PR Diff
        id: get_diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} HEAD > pr_diff.txt
          
          if [ ! -s pr_diff.txt ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # 2. cURL 명령어로 Gemini 3.5 API 직접 호출
      - name: Request Gemini 3.5 Review
        if: steps.get_diff.outputs.has_changes == 'true'
        id: gemini_req
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROMPT="당신은 시니어 개발자입니다. 아래 풀 리퀘스트(PR) 코드 변경 사항을 분석하여 버그 가능성, 보안, 가독성 개선점을 찾아 한국어로 친절한 리뷰 댓글을 작성해 주세요.\n\n[코드 변경 사항]\n$(cat pr_diff.txt | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')"
          
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"contents\": [{\"parts\": [{\"text\": \"${PROMPT}\"}]}]}")
          
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text')
          echo "$REVIEW_TEXT" > gemini_review.txt

      # 3. 제미니가 작성한 리뷰를 PR 댓글로 달기
      - name: Comment PR
        if: steps.get_diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gemini_review.txt', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
